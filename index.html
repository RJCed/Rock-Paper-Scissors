<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div id="screen">

        <!-- Upper Part of Screen -->

        <div id="upper">
            <div class="choice">
                <h1 id="humanChoice">🤜</h1>
                <p>User</p>
            </div>

            <div id="result">
                <h1 id="upperResultText">Rock Paper Scissors</h1>
                <h2 id="lowerResultText">You: 0 Computer: 0</h2>
            </div>

            <div class="choice">
                <h1 id="computerChoice">🤛</h1>
                <p>Computer</p>
            </div>
        </div>
        
        <!-- Lower Part of Screen -->

        <div id="lower">
            <button id="rock">
                <h1>🤜</h1>
                <p>ROCK</p>
            </button>
            <button id="paper">
                <h1>🫱</h1>
                <p>PAPER</p>
            </button>
            <button id="scissors">
                <h1>✌️</h1>
                <p>SCISSORS</p>
            </button>
        </div>
    </div>

    <!-- Pop-up -->

    <dialog id="inputRounds">
        <h1>Rock Paper Scissors</h1>
        <div>
            <label for="inputScore">Winning Score:</label>
            <input type="number" id="inputScore">
        </div>
        <button id="submitScore">Play</button>
    </dialog>

    <dialog id="outcome">
        <h1 id="finalResult">OUTCOME</h1>
        <h2 id="finalScore">You: Computer: </h2>
        <button id="playAgain">Play Again</button>
    </dialog>
</body>
</html>
